<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" width="420" height="800">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Arrière-plan Smartphone -->
  <rect x="10" y="10" width="400" height="780" rx="36" fill="#1E293B" />
  <rect x="18" y="18" width="384" height="764" rx="28" fill="#F4F6F9" />

  <!-- Barre de statut Android -->
  <path d="M 18,18 L 402,18 A 28,28 0 0,1 402,46 L 18,46 Z" fill="#0D47A1" />
  <text x="36" y="38" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" font-weight="bold">12:00</text>
  <circle cx="210" cy="32" r="6" fill="#000000" />
  <text x="340" y="38" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12">100% 🔋</text>

  <!-- Bandeau supérieur fixe (Score mis à jour: 1 / 5) -->
  <g filter="url(#shadow)">
    <rect x="18" y="46" width="384" height="96" fill="#FFFFFF" />
  </g>
  <text x="34" y="80" fill="#1A73E8" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="20" font-weight="bold">Quiz en Images</text>
  
  <!-- Badge Score en haut à droite (1 / 5) -->
  <rect x="278" y="60" width="108" height="32" rx="16" fill="#E8F0FE" />
  <text x="332" y="81" fill="#1967D2" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Score : 1 / 5</text>

  <!-- Barre de progression (1/5 remplie) -->
  <rect x="34" y="104" width="352" height="8" rx="4" fill="#E2E8F0" />
  <rect x="34" y="104" width="70" height="8" rx="4" fill="#1A73E8" />
  <text x="34" y="128" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11">Progression : 1 / 5 questions répondues</text>

  <!-- Contenu -->
  <text x="34" y="166" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="14" font-weight="bold">Question 1 sur 5</text>

  <!-- Illustration Triangle -->
  <rect x="34" y="180" width="352" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  <polygon points="210,195 280,305 140,305" fill="#FF5722" stroke="#BF360C" stroke-width="3" stroke-linejoin="round" />

  <text x="34" y="360" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="16" font-weight="bold">Combien de côtés possède cette figure ?</text>

  <!-- Choix 1 (désactivé) -->
  <rect x="34" y="380" width="352" height="46" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="54" y="409" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="14">A. 4 côtés</text>

  <!-- Choix 2 (BONNE RÉPONSE CHOISIE - VERT) -->
  <rect x="34" y="434" width="352" height="46" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" />
  <text x="54" y="463" fill="#15803D" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="14" font-weight="bold">✓ B. 3 côtés (Votre choix - Correct)</text>

  <!-- Choix 3 (désactivé) -->
  <rect x="34" y="488" width="352" height="46" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <text x="54" y="517" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="14">C. 5 côtés</text>

  <!-- Message de retour / Feedback -->
  <rect x="34" y="546" width="352" height="52" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
  <text x="54" y="578" fill="#065F46" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="15" font-weight="bold">✓ Bonne réponse ! Bravo ! (+1 point)</text>

  <!-- Bouton Question suivante -->
  <g filter="url(#shadow)">
    <rect x="34" y="614" width="352" height="52" rx="12" fill="#1A73E8" />
  </g>
  <text x="210" y="646" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Question suivante →</text>
</svg>
