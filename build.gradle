// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.3.2' apply false
    id 'com.android.library' version '8.3.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
}

// Deplacer la compilation en dehors de OneDrive pour eviter les verrous de fichiers AccessDenied
File externalBuildDir = new File(System.getProperty("user.home"), ".android_build_quiz/QuizImages")
allprojects {
    layout.buildDirectory.set(new File(externalBuildDir, project.name))
}
